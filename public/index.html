<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Social Bio Writer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf2f8 0%, #fbe0ee 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #6b1d47;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #c22a7e; font-weight: 800; }
  .subtitle { color: #a25a83; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #fffafc;
    border: 2px solid #f5c2de;
    border-radius: 20px;
    padding: 30px 26px;
  }
  textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #f5c2de;
    background: #fff;
    color: #6b1d47;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    resize: vertical;
    min-height: 70px;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #c22a7e;
    color: #fff;
    box-shadow: 0 5px 0 #8a1a58;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a1a58; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #a25a83; min-height: 1.2em; }
  .result-body {
    font-size: 1.1rem;
    line-height: 1.6;
    margin: 20px 0 4px;
    color: #6b1d47;
    font-weight: 600;
    background: #fbe0ee;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .footer-note { color: #a25a83; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #f5c2de;
    border-top-color: #c22a7e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">💬</div>
    <h1>Social Bio Writer</h1>
    <p class="subtitle">Enter 2-3 facts about yourself, get a bio built from them. 100% on-device.</p>

    <div class="card">
      <textarea id="mainInput" placeholder="e.g. software engineer, obsessed with houseplants, runs marathons on weekends"></textarea>
      <button class="action" id="generateBtn">Write My Bio</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Writing your bio...';

      try {
        const res = await fetch('/api/bio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ facts: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-body">${escapeHtml(data.bio)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
    });
  </script>
</body>
</html>
